<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #000;
        }


        /* =========================
           FONDO
        ========================= */

        .contenedor {

            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at center,

                    #ff5b8d 0%,
                    #c2185b 30%,
                    #5c0731 60%,
                    #15000b 100%
                );
        }


        /* Luz */

        .luz {

            position: absolute;

            width: 500px;
            height: 500px;

            background:
                rgba(255, 60, 120, 0.25);

            border-radius: 50%;

            filter: blur(90px);

            animation:
                respirar 4s infinite alternate;
        }


        @keyframes respirar {

            from {

                transform: scale(.8);

                opacity: .4;
            }

            to {

                transform: scale(1.3);

                opacity: .8;
            }
        }


        /* =========================
           CONTENIDO
        ========================= */

        .contenido {

            position: relative;

            z-index: 10;

            text-align: center;

            color: white;

            animation:
                aparecer 2s ease forwards;
        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(40px)
                    scale(.8);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           TITULO
        ========================= */

        .titulo {

            font-size:
                clamp(45px, 13vw, 110px);

            font-weight: bold;

            letter-spacing: 4px;

            text-shadow:

                0 0 10px white,
                0 0 25px #ff2d6f,
                0 0 50px #ff0055;

            animation:
                brillo 2s infinite alternate;
        }


        @keyframes brillo {

            from {

                text-shadow:

                    0 0 10px white,
                    0 0 20px #ff2d6f;
            }

            to {

                text-shadow:

                    0 0 20px white,
                    0 0 40px #ff2d6f,
                    0 0 70px #ff0055;
            }
        }


        /* =========================
           CORAZÓN
        ========================= */

        .corazon {

            position: relative;

            width: 130px;
            height: 130px;

            margin: 40px auto 20px;

            transform: rotate(-45deg);

            background: #ff174f;

            box-shadow:

                0 0 20px #ff174f,
                0 0 50px #ff174f,
                0 0 90px #ff174f;

            animation:
                latido 1.2s infinite;
        }


        .corazon::before,
        .corazon::after {

            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            background: #ff174f;

            border-radius: 50%;
        }


        .corazon::before {

            top: -65px;
            left: 0;
        }


        .corazon::after {

            top: 0;
            left: 65px;
        }


        @keyframes latido {

            0%,100% {

                transform:
                    rotate(-45deg)
                    scale(1);
            }

            15% {

                transform:
                    rotate(-45deg)
                    scale(1.15);
            }

            30% {

                transform:
                    rotate(-45deg)
                    scale(1);
            }

            45% {

                transform:
                    rotate(-45deg)
                    scale(1.12);
            }

            60% {

                transform:
                    rotate(-45deg)
                    scale(1);
            }
        }


        /* =========================
           FRASE
        ========================= */

        .frase {

            margin-top: 50px;

            font-size:
                clamp(18px, 5vw, 30px);

            letter-spacing: 2px;
        }


        /* =========================
           BOTÓN
        ========================= */

        .boton {

            margin-top: 30px;

            padding: 14px 30px;

            border:

                1px solid
                rgba(255,255,255,.6);

            border-radius: 30px;

            background:
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(10px);

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: .3s;
        }


        .boton:hover {

            transform: scale(1.08);

            background:
                rgba(255,255,255,.25);
        }


        /* =========================
           FOTO
        ========================= */

        .foto-container {

            position: fixed;

            inset: 0;

            z-index: 50;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                rgba(0,0,0,.75);

            backdrop-filter:
                blur(8px);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1s ease;
        }


        .foto-container.mostrar {

            opacity: 1;

            visibility: visible;
        }


        .foto {

            width: min(85vw, 500px);

            max-height: 75vh;

            object-fit: cover;

            border-radius: 25px;

            border:
                4px solid
                rgba(255,255,255,.8);

            box-shadow:

                0 0 30px #ff2d6f,
                0 0 70px #ff0055;

            transform:
                scale(.5)
                rotate(-8deg);

            opacity: 0;

            transition:

                transform 1s
                cubic-bezier(.17,.67,.3,1.4),

                opacity 1s ease;
        }


        .foto-container.mostrar .foto {

            transform:
                scale(1)
                rotate(0deg);

            opacity: 1;
        }


        /* =========================
           MENSAJE SOBRE FOTO
        ========================= */

        .mensaje {

            position: absolute;

            bottom: 8%;

            left: 0;
            right: 0;

            text-align: center;

            color: white;

            font-size:
                clamp(20px, 6vw, 35px);

            font-weight: bold;

            text-shadow:

                0 0 10px #ff2d6f,
                0 0 25px #ff0055;

            opacity: 0;

            transform:
                translateY(20px);

            transition:
                1s ease;

            transition-delay:
                .8s;
        }


        .foto-container.mostrar
        .mensaje {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =========================
           CORAZONES FLOTANTES
        ========================= */

        .corazon-flotante {

            position: absolute;

            bottom: -50px;

            z-index: 5;

            color: #ff5c91;

            font-size: 20px;

            animation:
                subir linear forwards;

            pointer-events: none;
        }


        @keyframes subir {

            from {

                transform:
                    translateY(0);

                opacity: 0;
            }

            10% {

                opacity: .9;
            }

            90% {

                opacity: .9;
            }

            to {

                transform:
                    translateY(-110vh);

                opacity: 0;
            }
        }


        /* =========================
           ESTRELLAS
        ========================= */

        .estrella {

            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 5px white,
                0 0 10px white;

            animation:
                parpadear 2s infinite alternate;
        }


        @keyframes parpadear {

            from {

                opacity: .2;

                transform:
                    scale(.5);
            }

            to {

                opacity: 1;

                transform:
                    scale(1.5);
            }
        }


        /* =========================
           MÓVIL
        ========================= */

        @media(max-width:600px) {

            .corazon {

                width: 90px;
                height: 90px;

                margin-top: 35px;
            }


            .corazon::before,
            .corazon::after {

                width: 90px;
                height: 90px;
            }


            .corazon::before {

                top: -45px;
            }


            .corazon::after {

                left: 45px;
            }


            .frase {

                margin-top: 40px;

                padding:
                    0 20px;
            }


            .foto {

                width: 85vw;

                max-height: 65vh;
            }
        }

    </style>

</head>


<body>


<div class="contenedor">

    <div class="luz"></div>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================= -->

    <div class="contenido">

        <div class="titulo">

            I LOVE YOU

        </div>


        <div class="corazon"></div>


        <div class="frase">

            ❤️ Eres mi persona favorita ❤️

        </div>


        <button
            class="boton"
            onclick="activarPagina()">

            Toca aquí ❤️

        </button>

    </div>


</div>



<!-- =========================
     FOTO
========================= -->

<div
    class="foto-container"
    id="fotoContainer">


    <!--

    CAMBIA "nosotros.jpg"
    POR EL NOMBRE DE TU FOTO

    -->

    <img
        src="IMG-20260813-WA0017.jpg"
        class="foto"
        alt="Nuestra foto">


    <div class="mensaje">

        ❤️ Siempre tú ❤️

    </div>

</div>



<!-- =========================
     MÚSICA
========================= -->

<!--

CAMBIA "cancion.mp3"
POR EL NOMBRE DE TU CANCIÓN

-->

<audio
    id="musica"
    loop>

    <source
        src="Toneshifterz & Atmozfears - You & Me (Official Video Clip).mp3"
        type="audio/mpeg">

</audio>



<script>


/* =================================
   ACTIVAR TODO
================================= */

function activarPagina() {


    /* -----------------------------
       REPRODUCIR MÚSICA
    ----------------------------- */

    const musica =
        document.getElementById("musica");


    musica.volume = 0.5;


    musica.play().catch(error => {

        console.log(
            "El navegador bloqueó el audio:",
            error
        );

    });


    /* -----------------------------
       MOSTRAR FOTO
    ----------------------------- */

    const foto =
        document.getElementById(
            "fotoContainer"
        );


    foto.classList.add("mostrar");


    /* -----------------------------
       EXPLOSIÓN DE CORAZONES
    ----------------------------- */

    explosionCorazones();


    /* -----------------------------
       MÁS CORAZONES
    ----------------------------- */

    for(let i = 0; i < 30; i++) {

        setTimeout(
            crearCorazon,
            i * 100
        );

    }

}



/* =================================
   CORAZONES FLOTANTES
================================= */

function crearCorazon() {


    const corazon =
        document.createElement("div");


    corazon.classList.add(
        "corazon-flotante"
    );


    const corazones = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓"
    ];


    corazon.innerHTML =
        corazones[
            Math.floor(
                Math.random() *
                corazones.length
            )
        ];


    corazon.style.left =
        Math.random() * 100 + "%";


    const tamaño =
        Math.random() * 25 + 15;


    corazon.style.fontSize =
        tamaño + "px";


    const duracion =
        Math.random() * 5 + 5;


    corazon.style.animationDuration =
        duracion + "s";


    document
        .querySelector(".contenedor")
        .appendChild(corazon);


    setTimeout(() => {

        corazon.remove();

    }, duracion * 1000);

}



/* =================================
   CORAZONES AUTOMÁTICOS
================================= */

setInterval(

    crearCorazon,

    700

);



/* =================================
   ESTRELLAS
================================= */

function crearEstrella() {


    const estrella =
        document.createElement("div");


    estrella.classList.add(
        "estrella"
    );


    estrella.style.left =
        Math.random() * 100 + "%";


    estrella.style.top =
        Math.random() * 100 + "%";


    estrella.style.animationDelay =
        Math.random() * 2 + "s";


    document
        .querySelector(".contenedor")
        .appendChild(estrella);

}



for(let i = 0; i < 60; i++) {

    crearEstrella();

}



/* =================================
   EXPLOSIÓN DE CORAZONES
================================= */

function explosionCorazones() {


    for(let i = 0; i < 50; i++) {


        const corazon =
            document.createElement("div");


        corazon.innerHTML = "❤️";


        corazon.style.position =
            "fixed";


        corazon.style.left =
            "50%";


        corazon.style.top =
            "50%";


        corazon.style.fontSize =
            Math.random() * 25 +
            15 +
            "px";


        corazon.style.zIndex =
            "100";


        document.body.appendChild(
            corazon
        );


        const angulo =
            Math.random() *
            Math.PI *
            2;


        const distancia =
            Math.random() *
            350 +
            100;


        const x =
            Math.cos(angulo) *
            distancia;


        const y =
            Math.sin(angulo) *
            distancia;


        corazon.animate(

            [

                {

                    transform:
                        "translate(-50%,-50%) scale(0)",

                    opacity: 1

                },

                {

                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        )
                        scale(1.5)`,

                    opacity: 0

                }

            ],

            {

                duration:
                    1200 +
                    Math.random() *
                    700,

                easing:
                    "cubic-bezier(.17,.67,.83,.67)"

            }

        );


        setTimeout(() => {

            corazon.remove();

        }, 2000);

    }

}

</script>


</body>

</html>
